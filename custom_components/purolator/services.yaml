track_parcel:
  fields:
    tracking_code:
      required: true
      example: "ABC123456789"
      selector:
        text:
    direction:
      default: incoming
      selector:
        select:
          options:
            - "incoming"
            - "outgoing"
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:

untrack_parcel:
  fields:
    tracking_code:
      required: true
      example: "ABC123456789"
      selector:
        text:

update_contents:
  fields:
    tracking_code:
      required: true
      example: "ABC123456789"
      selector:
        text:
    contents:
      required: false
      example: "Running shoes"
      selector:
        text:
